<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi – Voice Vocabulary Coach</title>
<style>
:root{--bg1:#eef0ff;--bg2:#e0f7ff;--card:#ffffffcc;--text:#1b1b2f;--muted:#666a85;--line:#d9dcf0;--a:#6c4bff;--b:#12b5d6;--ok:#16a34a;--bad:#e11d48;--chip:#f1f2fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#14122b;--bg2:#0b2230;--card:#1e1c3acc;--text:#f1f1fb;--muted:#a3a6c4;--line:#34325a;--chip:#2a2850}}
:root[data-theme="dark"]{--bg1:#14122b;--bg2:#0b2230;--card:#1e1c3acc;--text:#f1f1fb;--muted:#a3a6c4;--line:#34325a;--chip:#2a2850}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:12px}
.orb{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 6px #6c4bff22}
.orb.live{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #12b5d622}}
h1{font-size:1.3rem;margin:0}header p{margin:0;color:var(--muted);font-size:.85rem}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px #6c4bff14;margin-bottom:14px}
.tabs{display:flex;gap:6px;background:var(--chip);padding:5px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.95rem}
.tabs button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);padding:7px 13px;border-radius:99px;cursor:pointer;font-size:.85rem}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:700}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;text-align:center;padding:10px;border-radius:14px;background:var(--chip)}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.72rem;color:var(--muted)}
.flash{min-height:210px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;cursor:pointer;padding:12px}
.flash .w{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}
.pos{color:var(--muted);font-style:italic}.def{font-size:1.1rem}.ex{color:var(--muted);font-size:.95rem}
.hint{font-size:.78rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:600;cursor:pointer;font-size:.92rem}
.btn.p{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0}
.btn.mic.rec{background:var(--bad);color:#fff;border:0}
.btn:disabled{opacity:.5}
input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left}.opt.good{background:var(--ok);color:#fff;border:0}.opt.wrong{background:var(--bad);color:#fff;border:0}
.q{font-size:1.15rem;font-weight:600;margin:6px 0}
.log{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 12px;border-radius:14px;font-size:.9rem;max-width:88%}
.msg.a{background:var(--chip);align-self:flex-start}.msg.u{background:var(--a);color:#fff;align-self:flex-end}
.list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:var(--chip);border-radius:12px;font-size:.9rem}
.item small{color:var(--muted);display:block}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:1.1rem}
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:.85rem;color:var(--muted)}
.settings input[type=range]{width:120px;margin:0;padding:0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><div class="orb" id="orb">🎙️</div><div><h1>Lexi</h1><p>Your voice vocabulary coach</p></div></div>
  <button class="btn" id="theme">🌓</button>
</header>

<div class="card">
  <div class="label">Choose what to study</div>
  <div class="chips" id="decks"></div>
  <div class="settings" style="margin-top:12px">
    <label><input type="checkbox" id="voiceOn" checked style="width:auto;margin:0 4px 0 0">Lexi speaks</label>
    <label>Speed <input type="range" id="rate" min="0.6" max="1.3" step="0.1" value="0.95"></label>
    <span id="deckCount"></span>
  </div>
</div>

<div class="stats">
  <div class="stat"><b id="sKnown">0</b><span>Learned</span></div>
  <div class="stat"><b id="sScore">0</b><span>Quiz score</span></div>
  <div class="stat"><b id="sStreak">0</b><span>Streak 🔥</span></div>
</div>

<div class="tabs" id="tabs">
  <button data-t="learn" class="on">Learn</button><button data-t="quiz">Quiz</button><button data-t="mine">My Words</button>
</div>

<section id="learn">
  <div class="card">
    <div class="flash" id="flash"></div>
    <div class="row">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn p" id="hear">🔊 Hear it</button>
      <button class="btn mic" id="say">🎤 Say it</button>
      <button class="btn" id="know">✓ I know it</button>
      <button class="btn" id="next">Next →</button>
    </div>
  </div>
</section>

<section id="quiz" class="hide">
  <div class="card">
    <div class="label">Lexi asks</div>
    <div class="q" id="qText">Press Start to begin.</div>
    <div class="opts" id="opts"></div>
    <div class="row" style="justify-content:flex-start">
      <button class="btn p" id="qStart">▶ New question</button>
      <button class="btn mic" id="qMic">🎤 Answer by voice</button>
      <button class="btn" id="qRepeat">🔁 Repeat</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px"><input id="typed" placeholder="…or type your answer" style="margin:0"><button class="btn" id="typedGo">Go</button></div>
  </div>
</section>

<section id="mine" class="hide">
  <div class="card">
    <div class="label">Add your own word</div>
    <input id="nw" placeholder="Word (e.g. serendipity)">
    <input id="nd" placeholder="Meaning">
    <input id="ne" placeholder="Example sentence (optional)">
    <button class="btn p" id="add">+ Add word</button>
    <div class="label" style="margin-top:18px">Or paste a list — one per line: word - meaning</div>
    <textarea id="bulk" rows="3" placeholder="ephemeral - lasting a very short time&#10;candid - honest and direct"></textarea>
    <button class="btn" id="addBulk">Import list</button>
  </div>
  <div class="card"><div class="label">Your words</div><div class="list" id="myList"></div></div>
</section>

<div class="card">
  <div class="label">Conversation</div>
  <div class="log" id="log"></div>
  <div class="hint" id="micHint" style="margin-top:8px"></div>
</div>
</div>

<script>
const BUILT={
 "Everyday":[["ambiguous","adj.","open to more than one meaning","Her answer was ambiguous, so we asked again."],["resilient","adj.","able to recover quickly from difficulty","Children are often remarkably resilient."],["meticulous","adj.","very careful about details","He is meticulous about his notes."],["candid","adj.","honest and direct","I appreciate your candid feedback."],["ephemeral","adj.","lasting a very short time","Fame can be ephemeral."],["reluctant","adj.","unwilling and hesitant","She was reluctant to speak first."]],
 "Academic":[["ubiquitous","adj.","found everywhere","Smartphones are now ubiquitous."],["paradigm","n.","a typical model or pattern of thinking","The discovery changed the scientific paradigm."],["mitigate","v.","to make something less severe","Trees help mitigate urban heat."],["hypothesis","n.","a proposed explanation to be tested","Her hypothesis was proven correct."],["pragmatic","adj.","practical rather than idealistic","We need a pragmatic solution."],["substantiate","v.","to support with evidence","Can you substantiate that claim?"]],
 "Business":[["leverage","v.","to use something to maximum advantage","We can leverage our existing customers."],["scalable","adj.","able to grow without losing performance","They built a scalable platform."],["stakeholder","n.","a person with an interest in a project","Update every stakeholder weekly."],["negotiate","v.","to discuss to reach an agreement","She negotiated a better salary."],["incentive","n.","something that motivates action","Bonuses are a strong incentive."],["streamline","v.","to make more efficient","We streamlined the onboarding process."]]
};
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mine=store.get("lexi_mine",[]),known=new Set(store.get("lexi_known",[])),sel=new Set(store.get("lexi_sel",["Everyday"])),
 score=0,streak=0,idx=0,flipped=false,cur=null,answered=true;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pool(){let p=[];for(const d in BUILT)if(sel.has(d))p.push(...BUILT[d]);if(sel.has("My Words"))p.push(...mine.map(m=>[m.w,"",m.d,m.e||""]));return p}
function renderDecks(){const names=[...Object.keys(BUILT),"My Words"];$("decks").innerHTML=names.map(n=>`<button class="chip ${sel.has(n)?"on":""}" data-d="${n}">${n}${n==="My Words"?" ("+mine.length+")":""}</button>`).join("");
 $("deckCount").textContent=pool().length+" words in play";}
$("decks").onclick=e=>{const d=e.target.dataset.d;if(!d)return;sel.has(d)?sel.delete(d):sel.add(d);if(!sel.size)sel.add(d);store.set("lexi_sel",[...sel]);idx=0;flipped=false;renderDecks();renderCard()};
function stats(){$("sKnown").textContent=known.size;$("sScore").textContent=score;$("sStreak").textContent=streak}
// ---------- voice ----------
const synth=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function log(t,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function speak(t){return new Promise(r=>{if(!synth||!$("voiceOn").checked)return r();synth.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=+$("rate").value;u.lang="en-US";u.onstart=()=>$("orb").classList.add("live");u.onend=u.onerror=()=>{$("orb").classList.remove("live");r()};synth.speak(u)})}
function say(t){log(t,"a");return speak(t)}
function listen(){return new Promise((res,rej)=>{if(!SR){$("micHint").textContent="Voice input isn't supported in this browser — try Chrome or Edge, or use the buttons/typing.";return rej()}
 synth&&synth.cancel();const r=new SR();r.lang="en-US";r.maxAlternatives=3;r.interimResults=false;
 r.onresult=e=>{const a=[...e.results[0]].map(x=>x.transcript.toLowerCase().trim());res(a)};
 r.onerror=e=>{$("micHint").textContent=e.error==="not-allowed"?"Microphone blocked — allow mic access, or type your answer instead.":"Didn't catch that. Try again.";rej()};
 r.onend=()=>document.querySelectorAll(".mic").forEach(b=>b.classList.remove("rec"));
 document.querySelectorAll(".mic").forEach(b=>b.classList.add("rec"));$("micHint").textContent="🎤 Listening…";r.start()})}
// ---------- learn ----------
function renderCard(){const p=pool();const f=$("flash");if(!p.length){f.innerHTML='<div class="def">Pick a deck or add your own words 👆</div>';return}
 idx=((idx%p.length)+p.length)%p.length;const [w,pos,d,e]=p[idx];
 f.innerHTML=flipped?`<div class="def">${esc(d)}</div>${e?`<div class="ex">“${esc(e)}”</div>`:""}<div class="hint">tap to flip back</div>`:`<div class="w">${esc(w)}</div><div class="pos">${esc(pos)}</div><div class="hint">tap card to reveal meaning</div>`;
 f.dataset.w=w}
$("flash").onclick=()=>{flipped=!flipped;renderCard()};
$("next").onclick=()=>{idx++;flipped=false;renderCard()};
$("prev").onclick=()=>{idx--;flipped=false;renderCard()};
$("hear").onclick=()=>{const p=pool()[idx];if(!p)return;flipped=true;renderCard();say(`${p[0]}. ${p[2]}.${p[3]?" For example: "+p[3]:""}`)};
$("know").onclick=()=>{const p=pool()[idx];if(!p)return;known.add(p[0].toLowerCase());store.set("lexi_known",[...known]);stats();say("Great, marked as learned!");$("next").click()};
$("say").onclick=async()=>{const p=pool()[idx];if(!p)return;await say(`Say the word: ${p[0]}`);try{const a=await listen();const ok=a.some(x=>x.includes(p[0].toLowerCase()));$("micHint").textContent="";log("You: "+a[0],"u");say(ok?"Perfect pronunciation!":`I heard "${a[0]}". Try again — it's ${p[0]}.`)}catch(e){}};
// ---------- quiz ----------
function ask(){const p=pool();if(p.length<2){say("Add or select at least two words to start a quiz.");return}
 cur=p[Math.floor(Math.random()*p.length)];answered=false;const wrong=p.filter(x=>x[0]!==cur[0]).sort(()=>Math.random()-.5).slice(0,3);
 const opts=[cur,...wrong].sort(()=>Math.random()-.5);$("qText").textContent="Which word means: “"+cur[2]+"”?";
 $("opts").innerHTML=opts.map(o=>`<button class="btn opt" data-w="${esc(o[0])}">${esc(o[0])}</button>`).join("");
 say("Which word means: "+cur[2]+"?")}
function judge(ans,fromBtn){if(answered||!cur)return;answered=true;const ok=ans.toLowerCase().includes(cur[0].toLowerCase())||ans.toLowerCase()===cur[0].toLowerCase();
 document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.w===cur[0])b.classList.add("good");else if(b.dataset.w.toLowerCase()===ans.toLowerCase())b.classList.add("wrong")});
 if(ok){score+=10;streak++;known.add(cur[0].toLowerCase());store.set("lexi_known",[...known]);say(`Correct! ${cur[0]} means ${cur[2]}.`)}else{streak=0;say(`Not quite. The answer is ${cur[0]}. ${cur[3]||""}`)}stats()}
$("opts").onclick=e=>{const w=e.target.dataset.w;if(w){log("You: "+w,"u");judge(w,true)}};
$("qStart").onclick=ask;
$("qRepeat").onclick=()=>cur&&say("Which word means: "+cur[2]+"?");
$("qMic").onclick=async()=>{if(!cur||answered){ask();return}try{const a=await listen();$("micHint").textContent="";log("You: "+a[0],"u");const hit=a.find(x=>x.includes(cur[0].toLowerCase()));judge(hit||a[0])}catch(e){}};
$("typedGo").onclick=()=>{const v=$("typed").value.trim();if(!v)return;$("typed").value="";log("You: "+v,"u");if(cur&&!answered)judge(v)};
$("typed").onkeydown=e=>{if(e.key==="Enter")$("typedGo").click()};
// ---------- my words ----------
function renderMine(){$("myList").innerHTML=mine.length?mine.map((m,i)=>`<div class="item"><div><b>${esc(m.w)}</b><small>${esc(m.d)}</small></div><button class="x" data-i="${i}">✕</button></div>`).join(""):'<div class="hint">No custom words yet.</div>';renderDecks()}
function save(){store.set("lexi_mine",mine);sel.add("My Words");store.set("lexi_sel",[...sel]);renderMine();renderCard()}
$("add").onclick=()=>{const w=$("nw").value.trim(),d=$("nd").value.trim();if(!w||!d){say("Please enter both a word and its meaning.");return}mine.push({w,d,e:$("ne").value.trim()});["nw","nd","ne"].forEach(i=>$(i).value="");save();say(`Added ${w} to your list.`)};
$("addBulk").onclick=()=>{let n=0;$("bulk").value.split("\n").forEach(l=>{const m=l.split(/\s[-–:]\s|\s?[:–]\s/);if(m.length>=2&&m[0].trim()){mine.push({w:m[0].trim(),d:m.slice(1).join(" - ").trim(),e:""});n++}});$("bulk").value="";if(n){save();say(`Imported ${n} words.`)}};
$("myList").onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;mine.splice(+i,1);save()};
// ---------- tabs / theme ----------
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;[...$("tabs").children].forEach(b=>b.classList.toggle("on",b===e.target));["learn","quiz","mine"].forEach(s=>$(s).classList.toggle("hide",s!==t));synth&&synth.cancel()};
$("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
renderDecks();renderMine();renderCard();stats();
log("Hi, I'm Lexi! Pick a deck, add your own words, then tap “Hear it”, “Say it”, or switch to Quiz and answer by voice.","a");
</script>
</body>
</html>
